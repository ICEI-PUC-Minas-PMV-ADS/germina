<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Germina | Estoque</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style-estoque.css">
</head>
<body>

    <!-- Ícones (desenhados uma vez e reaproveitados com <use>) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="i-menu" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></symbol>
        <symbol id="i-collapse" viewBox="0 0 24 24"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></symbol>
        <symbol id="i-sprout" viewBox="0 0 24 24"><path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/></symbol>
        <symbol id="i-dollar" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></symbol>
        <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></symbol>
        <symbol id="i-layers" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></symbol>
        <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></symbol>
        <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
    </svg>

    <div class="app-container">

        <div class="overlay" id="overlay"></div>

        <!-- ========== ÁREA PRINCIPAL ========== -->
        <div class="main-wrapper">

            <header class="header">
                <div class="header-left">
                    <button type="button" class="btn-icon mobile-menu-button" id="mobileMenuButton" aria-label="Abrir menu">
                        <svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-menu"/></svg>
                    </button>
                    <div class="breadcrumb">
                        <span>Menu inicial</span>
                        <span>/</span>
                        <strong>Estoque</strong>
                    </div>
                </div>
            </header>

            <main class="content">

                <!-- Título e botões -->
                <div class="page-header">
                    <div>

                        <h1 class="page-title">Painel de Estoque</h1>

                    </div>

                    <div class="page-actions">
                        <button type="button" class="btn-primary" id="btnAdicionar">
                            <span aria-hidden="true">+</span>
                            <span>Adicionar Produto</span>
                        </button>
                        <button type="button" class="btn-secondary" id="btnRetirar">
                            <span aria-hidden="true">-</span>
                            <span>Editar Produto</span>
                        </button>
                    </div>
                </div>

<form id="formulario" class="escondido">
    <input type="text" placeholder="Nome" required>
    <select class="input">
      <option >semente</option>
      <option >Inseticidas</option>
      <option >Corretivos de Solo</option>
      <option >Fertilizantes</option>
    </select>

    <input type="number" placeholder="Quantidade" min="0">
    <select class="input">
      <option>Un</option>
      <option>Kg</option>
      <option>L</option>
      <option>Ml</option>
    </select>

    <select class="input">
      <option>Ativo</option>
      <option>Inativo</option>
    </select>
    <button type="submit">Adicionar</button>
    <button type="button" id="btnCancelar">Cancelar</button>   
  </form>  

  
   

                <!-- Cartões de resumo -->
                <section class="summary-cards" aria-label="Resumo do estoque">

                    <div class="card summary-card">
                        <span class="action-icon" aria-hidden="true">🌾</span>
                        <div>
                            <strong id="totalProdutos">0</strong>
                            <small>Total de Produtos</small>
                        </div>
                    </div>

                    <div class="card summary-card">
                        <span class="action-icon" aria-hidden="true">📦</span>
                        <div>
                            <strong id="totalItens">0</strong>
                            <small>Itens em Estoque</small>
                        </div>
                    </div>

                    <div class="card summary-card summary-card--warning">
                        <span class="action-icon" aria-hidden="true">⚠️</span>
                        <div>
                            <strong id="estoqueBaixo">0</strong>
                            <small>Estoque Baixo</small>
                        </div>
                    </div>

                </section>

                <!-- Tabela de produtos -->
                <section class="card table-card">
                    <div class="section-heading">
                        <h2 class="section-title">Produtos no Estoque</h2>
                    </div>

                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Nome</th>
                                    <th>Categoria</th>
                                    <th>Quantidade</th>
                                    
                                    <th>Status</th>
                                   
                                </tr>
                            </thead>
                            <tbody id="corpoTabela">

                            </tbody>
                        </table>
                    </div>

                    <div class="empty-state" id="mensagemVazia">
                        <p>Nenhum produto cadastrado ainda.</p>
                        <p>Clique em <strong>"Adicionar Produto"</strong> para começar!</p>
                    </div>
                </section>

            </main>
        </div>
    </div>

    <!-- Mantido do seu HTML original (use para janelas/modais, se precisar) -->
    <div class="fundo-escuro" id="fundoEscuro"></div>

    <script src="estoque.js"></script>
</body>
</html>
