<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | Germina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="split">
    <section class="banner banner--cadastro" role="img" aria-label="Produtora rural em um curral"></section>

    <section class="card card--cadastro">
      <h1>Cadastre-se</h1>
      <form id="form-cadastro">
        <input type="text" id="nome" placeholder="Nome completo" autocomplete="name" required>
        <input type="email" id="email" placeholder="E-mail" autocomplete="email" required>

        <fieldset class="opcoes">
          <legend>Qual opção te descreve melhor?</legend>
          <label><input type="radio" name="perfil" value="produtor" checked> Produtor(a) rural</label>
          <label><input type="radio" name="perfil" value="familiar"> Agricultor(a) familiar</label>
          <label><input type="radio" name="perfil" value="estudante"> Estudante ou profissional do agronegócio</label>
          <label><input type="radio" name="perfil" value="horta"> Cultivo para consumo próprio / Horta doméstica</label>
          <label><input type="radio" name="perfil" value="iniciante"> Estou começando a cultivar</label>
        </fieldset>

        <div class="senhas">
          <input type="password" id="senha" placeholder="Senha" autocomplete="new-password" required>
          <input type="password" id="confirmar-senha" placeholder="Confirmação de senha" autocomplete="new-password" required>
        </div>

        <p id="mensagem" class="mensagem mensagem--erro" role="alert"></p>
        <button type="submit" class="btn">Criar conta</button>
      </form>

      <p class="ja-tem-conta">Já tem conta?</p>
      <a href="login.html" class="link-card" style="margin-top:8px">Entrar</a>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
